<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Caps Mockup — SID Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --color-primary: #9b7ed8;
            --color-primary-dark: #7860a8;
            --color-bg: #f6f3fb;
            --color-bg-secondary: #eee9f5;
            --color-text: #362f50;
            --color-text-secondary: #524d6b;
            --color-text-muted: #7a7494;
            --color-border: #ece8f4;
            --color-card-bg: #fff;
            --pastel-purple: #c4b0f0;
            --pastel-pink: #f0b4d4;
            --pastel-rose: #f4a0b8;
            --pastel-mint: #98dcd4;
            --pastel-sky: #a0cef0;
            --vivid-purple: #a78bdf;
            --vivid-pink: #dc8ab8;
            --vivid-mint: #3cb8a8;
            --vivid-sky: #5ea8d8;
            --vivid-lavender: #a888d0;
            --vivid-rose: #d88a9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            display: flex;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══ SMALL CAPS UTILITY ═══ */
        .sc {
            font-variant: small-caps;
            letter-spacing: 0.5px;
        }

        /* ═══ SIDEBAR ═══ */
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, rgba(196,176,240,0.1) 0%, rgba(240,180,212,0.06) 40%, rgba(152,220,212,0.06) 70%, rgba(160,206,240,0.06) 100%);
            border-right: 1px solid var(--color-border);
            padding: 22px 12px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            padding: 0 6px 20px;
            border-bottom: 1px solid var(--color-border);
        }
        .brand-mark {
            width: 36px; height: 36px;
            background: var(--vivid-purple);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: white; font-size: 15px;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 2px 8px rgba(155, 126, 216, 0.3);
        }
        .brand-name {
            font-weight: 700; font-size: 15px;
            font-family: 'Outfit', sans-serif;
            line-height: 1.2;
        }
        .brand-label {
            font-size: 10px; color: var(--color-text-muted);
            text-transform: uppercase; letter-spacing: 1.5px;
            font-weight: 700;
        }
        .nav-menu { display: flex; flex-direction: column; gap: 4px; }
        .nav-item {
            padding: 11px 14px; border-radius: 10px;
            font-size: 14px; font-weight: 600;
            color: var(--color-text-secondary);
            display: flex; align-items: center; gap: 10px;
            position: relative; cursor: pointer;
            border: none; background: transparent;
            font-family: 'Quicksand', sans-serif;
        }
        .nav-item.active {
            background: rgba(160,206,240,0.12);
            color: var(--vivid-lavender);
            font-weight: 700;
        }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
            width: 3px; border-radius: 0 3px 3px 0;
            background: var(--vivid-lavender);
        }
        .nav-icon svg { width: 18px; height: 18px; }
        .nav-badge {
            margin-left: auto;
            background: var(--vivid-rose);
            color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 2px 7px; border-radius: 10px;
        }

        /* ═══ MAIN ═══ */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* ═══ HEADER ═══ */
        .header {
            padding: 18px 32px;
            border-bottom: 1px solid rgba(196,176,240,0.15);
            background: linear-gradient(135deg, rgba(196,176,240,0.1) 0%, rgba(240,180,212,0.07) 25%, rgba(152,220,212,0.06) 50%, rgba(160,206,240,0.08) 75%, rgba(196,176,240,0.06) 100%);
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 18px; }
        .mascot {
            width: 80px; height: 80px;
            filter: drop-shadow(0 4px 12px rgba(212, 169, 106, 0.3));
        }
        .header-title h1 {
            font-size: 26px; font-weight: 700;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.3px;
        }
        .header-title p {
            font-size: 14px; font-weight: 500;
            color: var(--color-text-secondary);
        }
        .time-pill {
            font-size: 12px; font-weight: 500;
            color: var(--color-text-secondary);
            padding: 6px 14px;
            background: rgba(155,126,216,0.06);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            display: flex; align-items: center; gap: 6px;
        }
        .time-pill svg { width: 14px; height: 14px; }

        /* ═══ CONTENT ═══ */
        .content { flex: 1; overflow-y: auto; padding: 28px 32px; }

        /* ═══ STAT CARDS ═══ */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 14px; padding: 16px;
            cursor: pointer;
            box-shadow: 0 1px 6px rgba(155,126,216,0.05);
        }
        .stat-card.mint { border-left: 3px solid var(--pastel-mint); background: linear-gradient(135deg, rgba(152,220,212,0.08) 0%, #fff 70%); }
        .stat-card.purple { border-left: 3px solid var(--pastel-purple); background: linear-gradient(135deg, rgba(196,176,240,0.08) 0%, #fff 70%); }
        .stat-card.pink { border-left: 3px solid var(--pastel-pink); background: linear-gradient(135deg, rgba(240,180,212,0.08) 0%, #fff 70%); }
        .stat-card.sky { border-left: 3px solid var(--pastel-sky); background: linear-gradient(135deg, rgba(160,206,240,0.08) 0%, #fff 70%); }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icon svg { width: 18px; height: 18px; }
        .stat-num {
            font-size: 26px; font-weight: 700;
            font-family: 'Outfit', sans-serif;
            line-height: 1.1;
        }
        .stat-card.mint .stat-num { color: var(--vivid-mint); }
        .stat-card.purple .stat-num { color: var(--vivid-purple); }
        .stat-card.pink .stat-num { color: var(--vivid-pink); }
        .stat-card.sky .stat-num { color: var(--vivid-sky); }
        .stat-label {
            font-size: 11.5px; font-weight: 700;
            color: var(--color-text-secondary);
            letter-spacing: 0.6px;
            margin-top: 2px;
            font-variant: small-caps;
        }

        /* ═══ CARDS ═══ */
        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 16px; padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(155,126,216,0.06);
        }
        .card-title {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 14px;
            margin-bottom: 18px;
            font-variant: small-caps;
            letter-spacing: 0.4px;
        }
        .card-title-icon { font-size: 17px; }
        .card-title-icon svg { width: 17px; height: 17px; }

        /* ═══ WEEK STRIP ═══ */
        .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .week-day {
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; padding: 10px 4px; border-radius: 10px;
            cursor: pointer; border: 1px solid transparent;
        }
        .week-day.today {
            background: rgba(155,126,216,0.06);
            border-color: var(--color-primary);
        }
        .week-day-name {
            font-size: 10px; font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .week-day-num {
            font-size: 17px; font-weight: 600;
            font-family: 'Outfit', sans-serif;
        }
        .week-day.today .week-day-num { color: var(--color-primary); }

        /* ═══ QUICK ACTIONS ═══ */
        .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .qa-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 10px; cursor: pointer;
            font-size: 13px; font-weight: 700;
            color: var(--color-text);
            font-family: 'Quicksand', sans-serif;
            font-variant: small-caps;
            letter-spacing: 0.4px;
        }
        .qa-icon {
            width: 30px; height: 30px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .qa-icon svg { width: 15px; height: 15px; }

        /* ═══ COMPARE LABEL ═══ */
        .compare-note {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--vivid-purple); color: #fff;
            padding: 10px 24px; border-radius: 20px;
            font-size: 13px; font-weight: 700;
            box-shadow: 0 4px 20px rgba(155,126,216,0.35);
            z-index: 100;
            font-variant: small-caps;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-mark">SID</div>
            <div>
                <div class="brand-name">Sid Portal</div>
                <div class="brand-label sc">Vendor Hub</div>
            </div>
        </div>
        <nav class="nav-menu">
            <button class="nav-item active">
                <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span>
                <span class="sc">Dashboard</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon"><i data-lucide="briefcase"></i></span>
                <span class="sc">Job Postings</span>
                <span class="nav-badge">7</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon"><i data-lucide="upload"></i></span>
                <span class="sc">Uploads</span>
            </button>
        </nav>
    </div>

    <div class="main">
        <div class="header">
            <div class="header-left">
                <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M38 12Q36 2 32 5Q34 10 38 14Z" fill="#7a5c3a"/>
                    <path d="M50 8Q50-2 46 2Q48 7 50 12Z" fill="#7a5c3a"/>
                    <path d="M62 12Q64 2 68 5Q66 10 62 14Z" fill="#7a5c3a"/>
                    <ellipse cx="50" cy="52" rx="38" ry="40" fill="#d4a96a"/>
                    <ellipse cx="50" cy="58" rx="28" ry="28" fill="#e8c88a"/>
                    <ellipse cx="18" cy="38" rx="8" ry="10" fill="#d4a96a"/>
                    <ellipse cx="82" cy="38" rx="8" ry="10" fill="#d4a96a"/>
                    <g><ellipse cx="38" cy="46" rx="10" ry="11" fill="white"/><circle cx="39" cy="46" r="6" fill="#3b8ed0"/><circle cx="40" cy="45" r="3" fill="#1a1a2e"/><circle cx="41" cy="43" r="1.5" fill="white"/></g>
                    <g><ellipse cx="62" cy="46" rx="10" ry="11" fill="white"/><circle cx="63" cy="46" r="6" fill="#3b8ed0"/><circle cx="64" cy="45" r="3" fill="#1a1a2e"/><circle cx="65" cy="43" r="1.5" fill="white"/></g>
                    <ellipse cx="50" cy="60" rx="8" ry="6" fill="#8b6baa"/>
                    <path d="M43 68Q50 76 57 68" stroke="#7a5c3a" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                <div class="header-title">
                    <h1>Welcome, Elevate Reach</h1>
                    <p class="sc">Saturday, March 28, 2026</p>
                </div>
            </div>
            <div class="time-pill">
                <i data-lucide="clock"></i>
                <span class="sc">6:52 Pm</span>
            </div>
        </div>

        <div class="content">
            <!-- Stats -->
            <div class="stats">
                <div class="stat-card mint">
                    <div class="stat-icon" style="background:rgba(152,220,212,0.18);color:var(--vivid-mint);"><i data-lucide="send"></i></div>
                    <div>
                        <div class="stat-num">0</div>
                        <div class="stat-label">To Post</div>
                    </div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-icon" style="background:rgba(196,176,240,0.18);color:var(--vivid-purple);"><i data-lucide="radio"></i></div>
                    <div>
                        <div class="stat-num">8</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>
                <div class="stat-card pink">
                    <div class="stat-icon" style="background:rgba(240,180,212,0.18);color:var(--vivid-pink);"><i data-lucide="clock"></i></div>
                    <div>
                        <div class="stat-num">7</div>
                        <div class="stat-label">Close Today</div>
                    </div>
                </div>
                <div class="stat-card sky">
                    <div class="stat-icon" style="background:rgba(160,206,240,0.18);color:var(--vivid-sky);"><i data-lucide="upload"></i></div>
                    <div>
                        <div class="stat-num">0<span style="font-size:14px;color:var(--color-text-muted);">/3</span></div>
                        <div class="stat-label">Uploaded</div>
                    </div>
                </div>
            </div>

            <!-- This Week -->
            <div class="card">
                <div class="card-title">
                    <span class="card-title-icon" style="color:var(--vivid-lavender);"><i data-lucide="calendar"></i></span>
                    <span>This Week</span>
                </div>
                <div class="week-strip">
                    <div class="week-day"><span class="week-day-name">Wed</span><span class="week-day-num">25</span></div>
                    <div class="week-day"><span class="week-day-name">Thu</span><span class="week-day-num">26</span></div>
                    <div class="week-day"><span class="week-day-name">Fri</span><span class="week-day-num">27</span></div>
                    <div class="week-day today"><span class="week-day-name">Sat</span><span class="week-day-num">28</span></div>
                    <div class="week-day"><span class="week-day-name">Sun</span><span class="week-day-num">29</span></div>
                    <div class="week-day"><span class="week-day-name">Mon</span><span class="week-day-num">30</span></div>
                    <div class="week-day"><span class="week-day-name">Tue</span><span class="week-day-num">31</span></div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-title">
                    <span class="card-title-icon" style="color:var(--vivid-mint);"><i data-lucide="zap"></i></span>
                    <span>Quick Actions</span>
                </div>
                <div class="qa-grid">
                    <button class="qa-btn">
                        <div class="qa-icon" style="background:rgba(196,176,240,0.1);color:var(--vivid-purple);"><i data-lucide="briefcase"></i></div>
                        <span>Workstation</span>
                    </button>
                    <button class="qa-btn">
                        <div class="qa-icon" style="background:rgba(160,206,240,0.1);color:var(--vivid-sky);"><i data-lucide="camera"></i></div>
                        <span>Screenshots</span>
                    </button>
                    <button class="qa-btn">
                        <div class="qa-icon" style="background:rgba(152,220,212,0.1);color:var(--vivid-mint);"><i data-lucide="package"></i></div>
                        <span>Resume Zip</span>
                    </button>
                    <button class="qa-btn">
                        <div class="qa-icon" style="background:rgba(240,180,212,0.1);color:var(--vivid-pink);"><i data-lucide="folder-open"></i></div>
                        <span>All Uploads</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="compare-note">Small Caps Mockup — Compare With Main Portal</div>

    <script>lucide.createIcons();</script>
</body>
</html>
